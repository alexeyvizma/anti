<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Антизависимость</title>
<style>
:root{--paper:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--sea:#0e7c86;--sea-d:#e3f1f2;--clay:#c2543a;--sh:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(20,40,50,.07);--ez:cubic-bezier(.22,1,.36,1);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#000;--surface:#161a1c;--ink:#f5f5f7;--muted:#9a9aa1;--line:#2a2f32;--sea:#4cc3cf;--sea-d:#12282b;--clay:#ff8a6b;--sh:0 8px 28px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--paper:#000;--surface:#161a1c;--ink:#f5f5f7;--muted:#9a9aa1;--line:#2a2f32;--sea:#4cc3cf;--sea-d:#12282b;--clay:#ff8a6b;--sh:0 8px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:400 17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;letter-spacing:-.011em;-webkit-font-smoothing:antialiased;min-height:100dvh}
main{max-width:440px;margin:0 auto;padding:16px 16px 48px}
h1,h2,.big{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;font-weight:700;letter-spacing:-.03em;margin:0}
h1{font-size:34px;line-height:1.1}h2{font-size:22px;letter-spacing:-.022em}
.muted{color:var(--muted);font-size:15px}
.card{background:var(--surface);border-radius:26px;padding:18px;margin-top:12px;box-shadow:var(--sh)}
.fx .card,.fx .hero{animation:in .6s var(--ez) both}.fx .card:nth-child(2){animation-delay:.05s}.fx .card:nth-child(3){animation-delay:.1s}.fx .card:nth-child(4){animation-delay:.15s}.fx .card:nth-child(n+5){animation-delay:.2s}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{min-height:46px;border-radius:999px;border:0;background:var(--sea-d);color:var(--sea);padding:0 18px;font-weight:600;cursor:pointer;transition:transform .25s var(--ez),background .3s,opacity .3s}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
button.on,button.primary{background:var(--sea);color:var(--paper)}
button.clay{background:var(--clay);color:var(--paper)}
button.ghost{background:none;color:var(--muted)}
input{min-height:46px;width:100%;border-radius:14px;border:1px solid transparent;background:var(--sea-d);padding:0 14px;margin-top:6px;transition:border-color .3s,background .3s}
input:focus{border-color:var(--sea);outline:0}
label{display:block;font-size:14px;font-weight:600;margin-top:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g2 .card{margin-top:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}
.big{font-size:60px;line-height:1}.num{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--sea-d);overflow:hidden;margin-top:14px}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sea),#6fd6c4);transform-origin:left;animation:grow 1.1s var(--ez) both}
@keyframes grow{from{transform:scaleX(0)}}
nav{display:flex;gap:4px;margin:10px 0 2px;padding:4px;border-radius:999px;background:var(--sea-d);position:sticky;top:6px;z-index:5;backdrop-filter:saturate(1.8) blur(18px);-webkit-backdrop-filter:saturate(1.8) blur(18px)}
nav button{flex:1;padding:0 2px;font-size:13px;min-height:38px;background:none;color:var(--muted)}nav button.on{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
button:disabled{opacity:.4;pointer-events:none}
.hero{text-align:center;margin-top:12px;border-radius:32px;padding:6px 18px 20px;background:radial-gradient(120% 80% at 50% 0,var(--sea-d),var(--surface));box-shadow:var(--sh)}
.hero svg{width:210px;height:230px;display:block;margin:0 auto;animation:fl 5s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-6px)}}
.sm{animation:sm 3.5s ease-in infinite}@keyframes sm{0%{opacity:0;transform:translateY(4px)}30%{opacity:.5}100%{opacity:0;transform:translateY(-16px)}}
.lvl{display:inline-block;font-size:13px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--sea);color:var(--paper)}
.hide{display:none}
.breath{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,var(--sea-d),transparent 70%);border:2px solid var(--sea);margin:22px auto;animation:b 8s cubic-bezier(.45,0,.55,1) infinite;display:grid;place-items:center;color:var(--sea);font-weight:600}
@keyframes b{0%,100%{transform:scale(.7)}50%{transform:scale(1.15)}}
@keyframes bt{0%,49%{opacity:1}50%,100%{opacity:0}}
.chip{min-height:38px;padding:0 14px;font-size:14px}
.lv{display:flex;gap:12px;align-items:center;padding:12px 0;opacity:.45}.lv.d{opacity:1}.lv .dot{width:14px;height:14px;border-radius:50%;background:var(--line);flex:none}.lv.d .dot{background:var(--sea)}.lv.c .dot{box-shadow:0 0 0 5px var(--sea-d),0 0 16px var(--sea)}
li{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}ul{list-style:none;margin:8px 0 0;padding:0}
.src{font-size:12px;color:var(--muted);margin-top:10px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.35s}
@media (prefers-reduced-motion:reduce){*,.hero svg{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var KINDS=[["alcohol","Алкоголь","вино, пиво, крепкое",800,3,["порция","порции","порций"]],["nicotine","Никотин","сигареты, вейп, снюс",350,12,["штука","штуки","штук"]],["sugar","Сахар","сладкое и напитки",250,2,["порция","порции","порций"]],["screens","Экраны","лента, которой больше, чем хочется",0,3,["час","часа","часов"]],["gambling","Азарт","ставки, казино, лотереи",1500,4,["ставка","ставки","ставок"]],["other","Своё","любое название",0,1,["раз","раза","раз"]]];
var CUR=[["RUB","₽","Рубли"],["UAH","₴","Гривны"],["EUR","€","Евро"],["USD","$","Доллары"]];
var MS=[[1,"первые сутки"],[3,"три дня"],[7,"неделя"],[14,"две недели"],[30,"месяц"],[60,"два месяца"],[90,"три месяца"],[180,"полгода"],[365,"год"],[730,"два года"],[1000,"тысяча дней"]];
var DAY=864e5,S={paths:[],active:null,slips:[],checkins:[],urges:[],reasons:[]},tab="today",adding=false,wave=null,draft={},timer=null;
try{var raw=localStorage.getItem("bereg");if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem("bereg",JSON.stringify(S))}catch(e){}}
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function num(v){var n=Number(String(v).replace(",",".").replace(/[^\d.]/g,""));return isFinite(n)?n:0}
function cur(p){for(var i=0;i<4;i++)if(CUR[i][0]===p.currency)return CUR[i];return CUR[0]}
function money(n,p){var v=Math.round(n),c=cur(p)[0];if(c==="UAH")return v.toLocaleString(LOC())+" ₴";return new Intl.NumberFormat(LOC(),{style:"currency",currency:c,maximumFractionDigits:0}).format(v)}
function plural(n,f){n=Math.abs(Math.trunc(n))%100;var a=n%10;if(n>10&&n<20)return f[2];if(a===1)return f[0];if(a>1&&a<5)return f[1];return f[2]}
function cnt(n){return(n>=10?Math.round(n):Math.round(n*10)/10).toLocaleString(LOC())}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function toIso(s){var a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2]).toISOString()}
function act(){return S.paths.filter(function(p){return p.id===S.active})[0]||S.paths[0]}
function stats(p){var now=Date.now(),cl=S.slips.filter(function(s){return s.pathId===p.id}).map(function(s){return Math.max(0,new Date(s.at)-new Date(s.cleanFrom))}),cu=Math.max(0,now-new Date(p.cleanSince)),tot=cl.concat([cu]).reduce(function(a,b){return a+b},0);return{cu:cu,tot:tot,slip:cl.length>0}}
function curPicker(v,fn){return'<div class="g4" role="group" aria-label="Валюта">'+CUR.map(function(c){return'<button type="button" class="'+(v===c[0]?"on":"")+'" aria-pressed="'+(v===c[0])+'" aria-label="'+c[2]+'" onclick="'+fn+'(\''+c[0]+'\')">'+c[1]+' <small>'+c[0]+'</small></button>'}).join("")+"</div>"}
function pathForm(d,pre,idp){var k=KINDS.filter(function(x){return x[0]===d.kind})[0]||KINDS[5],c=CUR.filter(function(x){return x[0]===d.currency})[0]||CUR[0];
return'<label>Название<input id="'+pre+'name" value="'+esc(d.name)+'" maxlength="40"></label><label>Считать чистым с<input type="date" id="'+pre+'date" max="'+ymd(new Date())+'" value="'+d.date+'"></label><label>Валюта</label>'+curPicker(d.currency,idp)+'<div class="g2"><label>В день, '+c[1]+'<input id="'+pre+'cost" inputmode="decimal" value="'+(d.cost||"")+'" placeholder="0"></label><label>Обычно, '+k[5][2]+'<input id="'+pre+'units" inputmode="decimal" value="'+d.units+'"></label></div>'}
function readForm(pre,kind){var k=KINDS.filter(function(x){return x[0]===kind})[0];return{kind:kind,name:document.getElementById(pre+"name").value.trim()||k[1],date:document.getElementById(pre+"date").value||ymd(new Date()),cost:num(document.getElementById(pre+"cost").value),units:num(document.getElementById(pre+"units").value)}}
function keep(pre,kind){if(!document.getElementById(pre+"name"))return;var r=readForm(pre,kind);draft.name=r.name;draft.date=r.date;draft.cost=r.cost;draft.units=r.units}
function newDraft(k){var x=KINDS.filter(function(a){return a[0]===k})[0];return{kind:k,name:k==="other"?"":x[1],date:ymd(new Date()),currency:(draft&&draft.currency)||"RUB",cost:x[3],units:x[4]}}
function pickKind(k){draft=newDraft(k);render()}
function setDraftCur(c){keep("d_",draft.kind);draft.currency=c;render()}
function createPath(){var r=readForm("d_",draft.kind),k=KINDS.filter(function(x){return x[0]===draft.kind})[0],id=uid();
S.paths.push({id:id,kind:draft.kind,name:r.name,cleanSince:new Date(r.date)>=new Date(ymd(new Date()))?new Date().toISOString():toIso(r.date),currency:draft.currency,dailyCost:r.cost,dailyUnits:r.units,unit:k[5][2]});S.active=id;adding=false;draft=null;save();render()}
function setCur(c){var p=act();keepEdit(p);p.currency=c;save();render()}
function keepEdit(p){var n=document.getElementById("e_name");if(!n)return;p.name=n.value.trim()||p.name;var d=document.getElementById("e_date").value;if(d&&d!==ymd(new Date(p.cleanSince)))p.cleanSince=toIso(d);p.dailyCost=num(document.getElementById("e_cost").value);p.dailyUnits=num(document.getElementById("e_units").value)}
function saveEdit(){keepEdit(act());save();render()}
function removePath(){var p=act();if(!confirm(trs("Удалить «")+p.name+trs("» вместе с историей?")))return;S.paths=S.paths.filter(function(x){return x.id!==p.id});S.slips=S.slips.filter(function(x){return x.pathId!==p.id});S.checkins=S.checkins.filter(function(x){return x.pathId!==p.id});S.urges=S.urges.filter(function(x){return x.pathId!==p.id});S.active=S.paths[0]?S.paths[0].id:null;save();render()}
function slip(){var p=act();if(!confirm(trs("Отметить срыв? Серия начнётся заново, общий итог сохранится.")))return;var at=new Date().toISOString();var note=(prompt(trs("Заметка о срыве (необязательно)"))||"").trim();S.slips.unshift({id:uid(),pathId:p.id,at:at,cleanFrom:p.cleanSince,note:note});p.cleanSince=at;save();render()}
function startWave(){wave=60;fx=true;clearInterval(timer);timer=setInterval(function(){wave--;var e=document.getElementById("wt");if(wave<=0){clearInterval(timer);wave=0;render()}else if(e)e.textContent=wave+" "+SEC()},1000);vt(render)}
function endWave(ok){clearInterval(timer);wave=null;S.urges.unshift({id:uid(),pathId:act().id,at:new Date().toISOString(),resisted:true});save();render()}
function addReason(){var i=document.getElementById("rs"),t=i.value.trim();if(!t)return;if(S.reasons.indexOf(t)<0)S.reasons.push(t);save();render()}
function delReason(i){S.reasons.splice(i,1);save();render()}
var MOODS=["Тяжело","Тускло","Ровно","Легче","Ясно"],SEEDS=["Просыпаться с ясной головой","Не прятать глаза от близких","Вернуть деньги, которые уходили","Снова доверять себе","Спать ночью, а не добирать утро","Быть тем, на кого можно опереться"],ci={key:"",mood:null,craving:4,note:"",saved:false};
function loose(ms){var d=Math.floor(ms/DAY),h=Math.floor(ms%DAY/36e5),m=Math.floor(ms%36e5/6e4);return d>=1?d+" "+plural(d,["день","дня","дней"]):h>=1?h+" "+plural(h,["час","часа","часов"]):m+" "+plural(m,["минута","минуты","минут"])}
function loadCi(p){var d=ymd(new Date()),k=p.id+d;if(ci.key===k)return;var e=S.checkins.filter(function(c){return c.pathId===p.id&&c.date===d})[0];ci={key:k,mood:e?e.mood:null,craving:e?e.craving:4,note:e?e.note:"",saved:false}}
function readCi(){var n=document.getElementById("cn");if(n)ci.note=n.value}
function pickMood(v){readCi();ci.mood=v;ci.saved=false;render()}
function saveCi(){readCi();var p=act(),d=ymd(new Date()),e=S.checkins.filter(function(c){return c.pathId===p.id&&c.date===d})[0];if(e){e.mood=ci.mood;e.craving=ci.craving;e.note=ci.note.trim()}else S.checkins.unshift({id:uid(),pathId:p.id,date:d,mood:ci.mood,craving:ci.craving,note:ci.note.trim()});ci.saved=true;save();render()}
function checkinView(p){loadCi(p);return'<div class="card"><h2>Как сегодня</h2><p class="muted" style="margin:4px 0 0">Короткая отметка. Её можно поправить до полуночи.</p><div class="row" style="margin-top:12px;flex-wrap:nowrap">'+MOODS.map(function(m,i){return'<button class="'+(ci.mood===i+1?"on":"")+'" style="flex:1;padding:0 2px;font-size:12px;min-height:56px;border-radius:16px" aria-pressed="'+(ci.mood===i+1)+'" onclick="pickMood('+(i+1)+')">'+m+"</button>"}).join("")+'</div><label>Тяга, <span id="cl">'+ci.craving+'</span> из 10<input type="range" min="0" max="10" step="1" value="'+ci.craving+'" style="padding:0;accent-color:var(--sea)" oninput="ci.craving=+this.value;document.getElementById(\'cl\').textContent=this.value"></label><label>Заметка<input id="cn" maxlength="200" value="'+esc(ci.note)+'" placeholder="Необязательно"></label><div class="row" style="margin-top:14px;align-items:center"><button class="primary" '+(ci.mood?"":"disabled")+' onclick="saveCi()">Сохранить</button>'+(ci.saved?'<span class="muted">Сохранено</span>':"")+"</div></div>"}
function weekView(p){var cells="";for(var i=6;i>=0;i--){var dt=new Date();dt.setHours(12,0,0,0);dt.setDate(dt.getDate()-i);var k=ymd(dt),h=S.checkins.filter(function(c){return c.pathId===p.id&&c.date===k})[0],bg=!h?"var(--sea-d)":h.mood<=2?"var(--clay)":h.mood===3?"var(--line)":"var(--sea)",fg=h&&h.mood!==3?"var(--paper)":"var(--muted)";cells+='<div style="text-align:center"><div class="muted" style="font-size:12px">'+new Intl.DateTimeFormat(LOC(),{weekday:"short"}).format(dt).replace(".","")+'</div><div style="margin-top:6px;height:32px;border-radius:99px;display:grid;place-items:center;font-size:13px;font-weight:700;background:'+bg+';color:'+fg+(i===0?";outline:1px solid var(--sea)":"")+'">'+(h?h.mood:"·")+"</div></div>"}return'<div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline"><h2>Неделя</h2><span class="muted">настроение по дням</span></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px">'+cells+"</div></div>"}
function journalView(){var nm=function(id){var q=S.paths.filter(function(x){return x.id===id})[0];return q?esc(q.name):"Путь"},rows=S.checkins.map(function(c){return{t:new Date(c.date+"T12:00:00").getTime(),c:c}}).concat(S.slips.map(function(s){return{t:new Date(s.at).getTime(),s:s}})).sort(function(a,b){return b.t-a.t});
if(!rows.length)return'<h1 style="margin-top:16px">Записи</h1><p class="muted">Здесь появятся короткие отметки дня и, если случатся, срывы — без вычёркивания того, что уже получилось.</p>';
return'<h1 style="margin-top:16px">Записи</h1>'+rows.map(function(r){if(r.s){var s=r.s;return'<div class="card"><b style="color:var(--clay)">Срыв · '+nm(s.pathId)+'</b><p class="muted" style="margin:4px 0">'+new Intl.DateTimeFormat(LOC(),{day:"numeric",month:"long",hour:"2-digit",minute:"2-digit"}).format(new Date(s.at))+'</p><p style="margin:6px 0 0">До этого держались '+loose(new Date(s.at)-new Date(s.cleanFrom))+'. Серия сохранена, счёт начат заново.</p>'+(s.note?'<p class="muted" style="margin:6px 0 0">'+esc(s.note)+"</p>":"")+"</div>"}
var c=r.c;return'<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>'+MOODS[c.mood-1]+'</b><span class="muted">'+nm(c.pathId)+'</span></div><p class="muted" style="margin:4px 0 0">'+new Intl.DateTimeFormat(LOC(),{day:"numeric",month:"long"}).format(new Date(c.date+"T12:00:00"))+" · тяга "+c.craving+' из 10</p><div class="bar" style="margin-top:10px"><i style="width:'+c.craving*10+'%;'+(c.craving>=7?"background:var(--clay)":"")+'"></i></div>'+(c.note?'<p style="margin:10px 0 0">'+esc(c.note)+"</p>":"")+"</div>"}).join("")}
function addSeed(i){var t=SEEDS[i];if(S.reasons.indexOf(t)<0)S.reasons.push(t);save();render()}
function whyView(){var rs=S.reasons.map(function(t,i){return'<div class="card" style="display:flex;gap:8px;align-items:flex-start;padding:10px 8px 10px 16px"><p class="big" style="font-size:20px;line-height:1.3;flex:1;padding-top:6px">'+esc(t)+'</p><button class="ghost chip" aria-label="Убрать: '+esc(t)+'" onclick="delReason('+i+')">✕</button></div>'}).join(""),seeds=SEEDS.map(function(t,i){return S.reasons.indexOf(t)<0?'<button class="chip" style="text-align:left;height:auto;padding:8px 12px" onclick="addSeed('+i+')">'+t+"</button>":""}).join("");
return'<h1 style="margin-top:16px">Зачем</h1><p class="muted">Не лозунги. То, что правда ваше — и что можно прочитать вслух, когда тянет.</p><div class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="rs" placeholder="Одна фраза" maxlength="140" style="margin:0"><button class="primary" onclick="addReason()">Добавить</button></div>'+(rs||'<p class="muted">Пока пусто. Можно начать с чужой фразы и переписать.</p>')+(seeds?'<p class="muted" style="margin-top:16px;font-weight:600">Если сложно начать</p><div class="row" style="margin-top:8px">'+seeds+"</div>":"")}
function setTab(t){tab=t;adding=false;fx=true;vt(render)}
function setActive(id){S.active=id;save();render()}
function header(){return'<div style="display:flex;justify-content:space-between;align-items:center"><p style="margin:0;font-weight:700;font-size:17px;letter-spacing:-.01em">Антизависимость</p><div class="row" style="gap:2px;flex-wrap:nowrap">'+[["ru","RU"],["uk","UA"],["en","EN"]].map(function(l){return'<button class="chip '+(lg()===l[0]?"on":"ghost")+'" style="min-height:30px;padding:0 10px;font-size:12px" onclick="setLang(\''+l[0]+'\')">'+l[1]+"</button>"}).join("")+"</div></div>"}
function onboarding(){
